name: Carter Desk — CI
on:
  push:
    branches: [main]
    paths: ['desk-*.js','desk.html','desk.css','api/desk-quote.js','tests/desk*.cjs','tests/vercel-ignore.test.cjs','scripts/desk-audit.cjs','scripts/vercel-ignore.cjs','vercel.json','tests/desk-chart.test.cjs','.github/workflows/desk-validate.yml']
  pull_request:
    paths: ['desk-*.js','desk.html','desk.css','api/desk-quote.js','tests/desk*.cjs','tests/vercel-ignore.test.cjs','scripts/desk-audit.cjs','scripts/vercel-ignore.cjs','vercel.json','tests/desk-chart.test.cjs','.github/workflows/desk-validate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test tests/desk.test.cjs tests/desk-replay.test.cjs tests/desk-visibility.test.cjs tests/desk-dom.test.cjs tests/desk-cloud.test.cjs tests/desk-chart.test.cjs tests/desk-holdings.test.cjs tests/vercel-ignore.test.cjs tests/tl-engine.test.cjs
      - run: |
          node --check desk-engine.js
          node --check desk-ledger.js
          node --check api/desk-quote.js
          node --check desk-replay.js
          node --check desk-monitor.js
          node --check desk-scenario.js
          node --check desk-paper.js
          node --check desk-chart.js
          node --check desk-holdings.js
          node --check desk-cloud.js
          node --check desk-cloud-ui.js
          node --check scripts/desk-audit.cjs
          node --check scripts/vercel-ignore.cjs
          if test -f desk-app.js; then node --check desk-app.js; fi
          test -f desk.html