name: PCS scheduled top 50
on:
  schedule:
    - cron: '7 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pcs.js', 'scanner.js', 'scripts/scan.cjs', '.github/workflows/scan.yml']
concurrency:
  group: pcs-background-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Analyze the exact top 50 with the PCS engine
        run: node scripts/scan.cjs
      - name: Publish current read-only snapshot
        run: |
          git config user.name 'PCS Scanner'
          git config user.email 'pcs-scanner@users.noreply.github.com'
          git add data/radar.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh PCS 4H top 50 snapshot'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
