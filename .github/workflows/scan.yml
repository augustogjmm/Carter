name: PCS scheduled top 50
on:
  workflow_dispatch:
concurrency:
  group: pcs-background-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Analyze the exact top 50 with the PCS engine
        run: node scripts/scan.cjs
      - name: Publish current read-only snapshot
        run: |
          git config user.name 'augustogjmm'
          git config user.email '44848888+augustogjmm@users.noreply.github.com'
          git add data/radar.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh PCS 4H top 50 snapshot'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
