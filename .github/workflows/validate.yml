name: Validate Carter 4H
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check engine.js
          node --check app.js
          node --check research.js
          node --check pcs.js
          node --check scanner.js
          node --check api/top50.js
          node --check api/market.js
          node --check audit.js
          node --check review.js
          node --check paper.js
          node --check mtf-study.js
          node --check carter-actual.js
          node --check research/carter_actual.cjs
      - name: Product regression tests
        run: node --test tests/product.test.cjs
      - name: PCS independent smoke tests
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const vm = require('node:vm');
          const c = {window:{}};
          vm.runInNewContext(fs.readFileSync('pcs.js','utf8'),c);
          const e=c.window.PCSEngine;
          assert(e && e.indicators && e.backtest && e.stats && e.dedup);
          const bars=Array.from({length:350},(_,i)=>{
            const p=100+i*.08+Math.sin(i/12)*2;
            return {t:Date.UTC(2020,0,1)+i*14400000,o:p,h:p+1.3,l:p-1.3,c:p+.2,v:100+i%27};
          });
          const s=e.indicators(bars);
          assert(Number.isFinite(s.atr[349]));
          assert(Number.isFinite(s.adx[349]));
          assert(Number.isFinite(s.ema200[349]));
          const newer=e.indicators([...bars,{t:bars.at(-1).t+14400000,o:100,h:200,l:1,c:120,v:10000}]);
          assert.equal(JSON.stringify(s.sig[300]),JSON.stringify(newer.sig[300]),'Future candle changed past signal');
          const bySlot=bars.map((b,i)=>({...b,o:100,h:101,l:99,c:100,v:100}));
          bySlot[251]={...bySlot[251],o:100,h:103,l:97,c:100};
          const sim={sig:bySlot.map(()=>({A:false,B:false})),atr:Array(350).fill(1)};
          sim.sig[250]={A:true,B:false};
          const result=e.backtest(bySlot,sim,1000,3);
          assert.equal(result.ops.length,1);
          assert.equal(result.legs.length,1);
          assert.equal(result.legs[0].why,'SL','Stop must have priority over TP1 in same candle');
          assert(Math.abs(result.legs[0].pnl-(result.curve.at(-1).equity-1000))<1e-6,'PnL must reconcile to equity');
          assert(e.stats(result).dd>0);
          assert(fs.readFileSync('index.html','utf8').includes('href="pcs.html"'));
          for(const id of ['pcsChart','pcsDecisionTitle','pcsAConditions','pcsBConditions','pcsStats','pcsSL','pcsTP1'])assert(fs.readFileSync('pcs.html','utf8').includes('id="'+id+'"'));
          console.log('PCS fixed-rule smoke tests: OK');
          JS
      - name: Top-50 radar smoke tests
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const vm = require('node:vm');
          const fs = require('node:fs');
          const sandbox = {window:{}};
          vm.runInNewContext(fs.readFileSync('pcs.js','utf8'),sandbox);
          vm.runInNewContext(fs.readFileSync('scanner.js','utf8'),sandbox);
          const core=sandbox.window.PCSScannerCore;
          assert(core && typeof core.classify==='function');
          const now=Math.floor(Date.now()/14400000)*14400000-14400000;
          const bars=Array.from({length:800},(_,i)=>{
            const p=100+i*.08+2*Math.sin(i/12);
            return {t:now-(799-i)*14400000,o:p,h:p+1,l:p-1,c:p+0.2,v:100+i%14};
          });
          const r=core.classify(bars);
          assert.equal(typeof r.signal,'boolean');
          assert(Number.isFinite(r.adx) && Number.isFinite(r.atr));
          assert.equal(r.signal, (r.A||r.B)&&!r.positionOpen);
          assert.throws(()=>core.classify(bars.slice(0,-1)),/sincronizada/);
          const x=Array.from({length:50},(_,i)=>({id:'asset-'+i,symbol:'T'+i,name:'Coin '+i,rank:i+1,price:1}));
          assert.equal(core.normalizeCoins(x).length,50);
          assert.throws(()=>core.normalizeCoins(x.slice(0,49)),/exactamente 50/);
          assert.equal(core.unscannable({id:'tether',symbol:'USDT',name:'Tether'},new Set(['USDT']),new Set()).status,'excluded');
          assert.equal(core.unscannable({id:'wrapped-bitcoin',symbol:'BTC',name:'Wrapped Bitcoin'},new Set(['BTC']),new Set()).status,'excluded');
          assert.equal(core.unscannable({id:'bitcoin',symbol:'BTC',name:'Bitcoin'},new Set(['BTC']),new Set()),null);
          assert.equal(core.unscannable({id:'unknown',symbol:'XXX',name:'Not listed'},new Set(),new Set()).status,'missing');
          for(const id of ['radarRows','radarProgress','radarPositive','radarRefresh','radarError','radarSelected']){
            assert(fs.readFileSync('pcs.html','utf8').includes('id="'+id+'"'));
          }
          assert(fs.readFileSync('pcs.html','utf8').includes('<script src="scanner.js"></script>'));
          console.log('Top 50 radar smoke tests OK');
          JS
      - name: Indicator and volume-profile smoke test
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const vm = require('node:vm');
          const fs = require('node:fs');
          const context={window:{}};
          vm.runInNewContext(fs.readFileSync('engine.js','utf8'),context);
          const e=context.window.CarterEngine;
          assert(e && e.indicators && e.volumeProfile && e.tradePlan);
          const candles=Array.from({length:500},(_,i)=>{
            const mid=100+i*.13+Math.sin(i/6)*1.5;
            return {t:i*14400000,o:mid-.14,h:mid+.7,l:mid-.65,c:mid+.14,v:100+i%18};
          });
          const s=e.indicators(candles,25,true);
          const last=candles.length-1;
          assert(Number.isFinite(s.adx[last]));
          assert(Number.isFinite(s.mom[last]));
          const vp=e.volumeProfile(candles.slice(-180));
          assert(vp && Number.isFinite(vp.poc) && vp.val < vp.vah);
          assert(vp.poc >= vp.low && vp.poc <= vp.high);
          const disabledTrend={...s,trend:s.trend.slice(),momentumOK:s.momentumOK.slice()};
          disabledTrend.trend[last]=false;
          disabledTrend.momentumOK[last]=false;
          const blocked=e.tradePlan(candles,disabledTrend,vp,candles[last].c,false,1000,1,true);
          assert.equal(blocked.blocked,true);
          assert.equal(blocked.entries.length,0);
          const blockedForecast=e.projectScenarios(candles,disabledTrend,vp,blocked,candles[last].c);
          assert(blockedForecast.marketMode!=='bullish');
          assert.equal(blockedForecast.entries.length,0);
          assert(Array.isArray(blockedForecast.supportSteps));
          const p=e.tradePlan(candles,s,vp,candles[last].c,false,1000,1);
          assert(p===null || Array.isArray(p.entries));
          assert(typeof e.empiricalProjection === 'function');
          const empirical=e.empiricalProjection(candles,s,null);
          assert(empirical && typeof empirical.valid==='boolean');
          if(empirical.valid){
            assert(empirical.sampleSize>=30);
            assert.equal(empirical.horizons.length,3);
            for(const period of empirical.horizons){
              assert(Number.isFinite(period.priceMid));
              assert(period.priceLow<=period.priceMid && period.priceMid<=period.priceHigh);
            }
          }
          assert(typeof e.projectScenarios === 'function');
          const forecast=e.projectScenarios(candles,s,vp,p,candles[last].c);
          assert(forecast && Array.isArray(forecast.recoveryPath));
          assert(Array.isArray(forecast.downPath));
          assert(Array.isArray(forecast.breakoutPath));
          assert(forecast.disclaimer.includes('NO representan probabilidades'));
          if(p && p.entries && p.entries.length){
            assert(Array.isArray(p.stages));
            assert.equal(p.stages.length,p.entries.length);
            p.stages.forEach((stage,n)=>{
              assert.equal(stage.fills,n+1);
              assert(Number.isFinite(stage.average));
              assert(Number.isFinite(stage.loss));
            });
          }
          const testPlan={
            entries:[{price:105},{price:100},{price:95}],
            stop:90,target:{price:125}
          };
          const projection=e.projectScenarios(candles,s,vp,testPlan,110);
          assert.equal(projection.entries.length,3);
          assert.equal(projection.recoveryPath.at(-1).price,125);
          assert.equal(projection.downPath.at(-1).price,90);
          assert(projection.zone.min<projection.zone.max);
          vm.runInNewContext(fs.readFileSync('research.js','utf8'),context);
          assert(context.window.CarterAudit && context.window.CarterAudit.run);
          const audit=context.window.CarterAudit.run(candles,s,false);
          assert.equal(audit.valid,true);
          assert.equal(audit.models.length,3);
          for(const model of audit.models){
            assert(Number.isInteger(model.train.n));
            assert(Number.isInteger(model.test.n));
            assert(model.train.n>=0 && model.test.n>=0);
            assert(Number.isFinite(model.train.maxDDR));
            assert(Number.isFinite(model.test.maxDDR));
          }
          assert.equal(audit.horizonBars,24);
          assert.equal(audit.feesPct,0.2);
          const html=fs.readFileSync('index.html','utf8');
          const app=fs.readFileSync('app.js','utf8');
          assert(html.includes('<script src="engine.js"></script>'));
          assert(html.includes('<script src="app.js"></script>'));
          assert(html.includes('<script src="research.js"></script>'));
          for(const id of ['forecastPullback','forecastContinuation','forecastFailure','stageRows','entryChecklist','forecastStatus','emp24','emp48','emp96','empEvents','analogueCount','analogueNote','auditRows','auditVerdict','auditMessage','auditRange','auditNotes']) {
            assert(html.includes('id="'+id+'"'), 'Missing prospective UI: '+id);
          }
          for (const m of app.matchAll(/\$\('([^']+)'\)/g)) {
            assert(html.includes('id="'+m[1]+'"'),'Missing HTML ID '+m[1]);
          }
          console.log('Carter 4H smoke tests: OK');
          JS
