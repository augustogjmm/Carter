name: Carter Desk — On-demand verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: carter-desk-diagnostics
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate engine and journal
        run: node --test tests/desk.test.cjs tests/tl-engine.test.cjs
      - name: Evaluate Top 50 snapshot without modifying main
        run: node scripts/desk-scan.cjs
      - name: Save diagnostic output without changing production
        uses: actions/upload-artifact@v4
        with:
          name: carter-desk-diagnostic
          path: data/desk-opportunities.json
