name: Carter Desk — Top 50 eligibility
on:
  schedule:
    - cron: '19 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desk-engine.js','api/desk-quote.js','scripts/desk-scan.cjs','tests/desk.test.cjs','.github/workflows/desk-scan.yml']
concurrency:
  group: carter-desk-eligibility
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate business rules and persistence tests
        run: node --test tests/desk.test.cjs tests/tl-engine.test.cjs
      - name: Evaluate recent 4H setups against daily regime and spot execution
        run: node scripts/desk-scan.cjs
      - name: Publish independent public snapshot only
        run: |
          git config user.name 'Carter Scanner'
          git config user.email '44848888+augustogjmm@users.noreply.github.com'
          snapshot="$(mktemp)"
          cp data/desk-opportunities.json "$snapshot"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            # Do not overwrite newer results already published by another runner.
            if test -f data/desk-opportunities.json && node -e "const f=require('node:fs');const o=JSON.parse(f.readFileSync('data/desk-opportunities.json','utf8'));const n=JSON.parse(f.readFileSync(process.argv[1],'utf8'));process.exit(o.lastCandle>=n.lastCandle&&Date.parse(o.generatedAt)>=Date.parse(n.generatedAt)?0:1)" "$snapshot"; then
              echo "Equal or newer snapshot already published"
              exit 0
            fi
            cp "$snapshot" data/desk-opportunities.json
            git add data/desk-opportunities.json
            if git diff --cached --quiet; then
              echo "No changes"
              exit 0
            fi
            git commit -m 'data: refresh Carter Desk opportunity eligibility'
            if git push origin HEAD:main; then
              echo "Desk snapshot published"
              exit 0
            fi
            echo "Concurrent update detected; retrying (attempt $attempt)"
            sleep 2
          done
          echo "Could not safely publish after five retries" >&2
          exit 1
