name: Actual Carter engine diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['engine.js', 'research.js', 'research/carter_actual.py', 'research/carter_actual.cjs', '.github/workflows/carter-actual.yml']
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install numpy==2.3.5 pandas==2.3.3 requests==2.32.5
      - run: python -u research/carter_actual.py
      - name: Publish actual engine evidence
        run: |
          git config user.name 'augustogjmm'
          git config user.email '44848888+augustogjmm@users.noreply.github.com'
          git add data/carter-actual
          git commit -m 'research: publish diagnostic from actual Carter engine'
          git pull --rebase origin main
          git push origin HEAD:main
