name: PCS independent real-data audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['research/pcs_verificador_independiente.py', 'research/run_audit.py', '.github/workflows/audit.yml']
concurrency:
  group: pcs-independent-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.3.5 pandas==2.3.3 requests==2.32.5 tabulate==0.9.0
      - name: Real exchange data and full independent protocol
        run: python -u research/run_audit.py
      - name: Publish results
        run: |
          git config user.name 'augustogjmm'
          git config user.email '44848888+augustogjmm@users.noreply.github.com'
          git add data/audit
          if ! git diff --cached --quiet; then
            git commit -m 'research: publish completed independent PCS audit on real market data'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
